services:
  developing:
    image: ubuntu:24.04
    working_dir: ${PWD:?PWD is required}
    network_mode: host
    user: "${SUDO_UID:-${UID:-UID is required}}:${SUDO_GID:-${GID:-GID is required}}"
    volumes:
      - type: bind
        source: /etc/passwd
        target: /etc/passwd
        read_only: true
      - type: bind
        source: /etc/group
        target: /etc/group
        read_only: true
      - type: bind
        source: /home/${SUDO_USER:-${USER:-USER is required}}
        target: /home/${SUDO_USER:-${USER:-USER is required}}
        read_only: true
      - type: bind
        source: .
        target: ${PWD:?PWD is required}
        read_only: true
      - type: bind
        source: ./.venv
        target: ${PWD:?PWD is required}/.venv
      - type: bind
        source: ./output
        target: ${PWD:?PWD is required}/output
      - type: bind
        source: ./skills
        target: ${PWD:?PWD is required}/skills
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
