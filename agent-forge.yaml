runtimes:
  codex:
    kind: codex
    options:
      config:
        mcp_servers:
          academic_army_mcp_tools:
            command: python
            args:
              - -m
              - mcp-server
            cwd: .
            env:
              PYTHONPATH: .
            tool_timeout_sec: 3600
  qwen:
    kind: qwen
    options:
      authType: openai
      model: deepseek-reasoner
      env:
        OPENAI_BASE_URL: https://api.deepseek.com
        OPENAI_MODEL: deepseek-v4-pro
        OPENAI_REASONING_EFFORT: high
      mcpServers:
        academic_army_mcp_tools:
          command: python
          args:
            - -m
            - mcp-server
          cwd: .
          env:
            PYTHONPATH: .
          timeout: 3600000

threads:
  codex-5.5-full-access:
    runtime: codex
    options:
      model: gpt-5.5
      sandboxMode: danger-full-access
      workingDirectory: .
  codex-5.5-read-only:
    runtime: codex
    options:
      model: gpt-5.5
      sandboxMode: danger-full-access # read-only
      workingDirectory: .
  codex-develop-5.5-full-access:
    runtime: codex
    options:
      model: gpt-5.5
      sandboxMode: danger-full-access
      workingDirectory: &developerWorkspacePath output/codebase
  codex-develop-5.5-read-only:
    runtime: codex
    options:
      model: gpt-5.5
      sandboxMode: danger-full-access # read-only
      workingDirectory: *developerWorkspacePath
  codex-develop-5.3-full-access:
    runtime: codex
    options:
      model: gpt-5.3-codex-spark
      workingDirectory: *developerWorkspacePath
      sandboxMode: danger-full-access
  qwen-develop-full-access:
    runtime: qwen
    options:
      cwd: *developerWorkspacePath
      permissionMode: yolo
  qwen-develop-read-only:
    runtime: qwen
    options:
      cwd: *developerWorkspacePath
      permissionMode: yolo # read-only

agents:
  skill-runner:
    thread: codex-5.5-full-access
  skill-evaluator:
    thread: codex-5.5-read-only
  skill-modifier:
    thread: codex-5.5-full-access
  coding-manager:
    thread: codex-develop-5.5-full-access
    constants:
      workspacePath: *developerWorkspacePath
  developer:
    thread: codex-develop-5.3-full-access
    constants:
      workspacePath: *developerWorkspacePath
  code-reviewer:
    thread: codex-develop-5.5-read-only
    constants:
      workspacePath: *developerWorkspacePath
  trajectory-optimizer:
    thread: codex-5.5-full-access
  memory-reader:
    thread: codex-5.5-read-only
    constants:
      memoryDir: .
  memory-modify-planner:
    thread: codex-5.5-full-access
    constants:
      memoryDir: .
  memory-modifier:
    thread: codex-5.5-full-access
    constants:
      memoryDir: .
  memory-create-planner:
    thread: codex-5.5-full-access
    constants:
      memoryDir: .
  memory-creator:
    thread: codex-5.5-full-access
    constants:
      memoryDir: .
