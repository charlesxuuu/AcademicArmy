runtimes:
  codex:
    kind: codex
    options:
      config:
        mcp_servers:
          academic_army_mcp_tools:
            command: python
            args:
              - -m
              - mcp-server
            cwd: .
            env:
              PYTHONPATH: .
            tool_timeout_sec: 3600
  deepseek-reasoner:
    kind: qwen
    options:
      authType: openai
      model: deepseek/deepseek-r1
      env:
        OPENAI_BASE_URL: https://openrouter.ai/api/v1
        OPENAI_MODEL: deepseek/deepseek-r1
      mcpServers:
        academic_army_mcp_tools:
          command: python
          args:
            - -m
            - mcp-server
          cwd: .
          env:
            PYTHONPATH: .
          timeout: 3600000
  glm-5.2:
    kind: qwen
    options:
      authType: openai
      model: z-ai/glm-5.2
      env:
        OPENAI_BASE_URL: https://openrouter.ai/api/v1
        OPENAI_MODEL: z-ai/glm-5.2
      mcpServers:
        academic_army_mcp_tools:
          command: python
          args:
            - -m
            - mcp-server
          cwd: .
          env:
            PYTHONPATH: .
          timeout: 3600000

threads:
  skill:
    runtime: glm-5.2
    options:
      cwd: .
      permissionMode: yolo
  develop:
    runtime: glm-5.2
    options:
      cwd: &developerWorkspacePath output/codebase
      permissionMode: yolo
  develop-cheap:
    runtime: deepseek-reasoner
    options:
      cwd: *developerWorkspacePath
      permissionMode: yolo
  memory:
    runtime: deepseek-reasoner
    options:
      cwd: &memoryWorkingDir output/developing-memory
      permissionMode: yolo

agents:
  skill-runner:
    thread: skill
  skill-evaluator:
    thread: skill
  skill-modifier:
    thread: skill
  coding-manager:
    thread: develop
    constants:
      workspacePath: *developerWorkspacePath
  developer:
    thread: develop-cheap
    constants:
      workspacePath: *developerWorkspacePath
  code-reviewer:
    thread: develop
    constants:
      workspacePath: *developerWorkspacePath
  trajectory-optimizer:
    thread: skill
  memory-reader:
    thread: memory
    constants:
      workingDir: *memoryWorkingDir
  memory-modify-planner:
    thread: memory
    constants:
      workingDir: *memoryWorkingDir
  memory-modifier:
    thread: memory
    constants:
      workingDir: *memoryWorkingDir
  memory-create-planner:
    thread: memory
    constants:
      workingDir: *memoryWorkingDir
  memory-creator:
    thread: memory
    constants:
      workingDir: *memoryWorkingDir
