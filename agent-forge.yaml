runtimes:
  codex:
    kind: codex
    options:
      config:
        mcp_servers:
          academic_army_mcp_tools:
            command: python
            args:
              - -m
              - mcp-server
            cwd: .
            env:
              PYTHONPATH: .
            tool_timeout_sec: 3600
  deepseek-v4-pro:
    kind: claude
    options:
      model: deepseek/deepseek-v4-pro
      effort: xhigh
      settings:
        env:
          ANTHROPIC_BASE_URL: https://ai-gateway.vercel.sh
          ANTHROPIC_API_KEY: ""
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek/deepseek-v4-pro
          ANTHROPIC_DEFAULT_SONNET_MODEL: deepseek/deepseek-v4-pro
          ANTHROPIC_DEFAULT_OPUS_MODEL: deepseek/deepseek-v4-pro
      mcpServers: &academicArmyMcpServers
        academic_army_mcp_tools:
          command: python
          args:
            - -m
            - mcp-server
          cwd: .
          env:
            PYTHONPATH: .
          timeout: 3600000
  deepseek-v4-flash:
    kind: claude
    options:
      model: deepseek/deepseek-v4-flash
      settings:
        env:
          ANTHROPIC_BASE_URL: https://ai-gateway.vercel.sh
          ANTHROPIC_API_KEY: ""
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek/deepseek-v4-flash
          ANTHROPIC_DEFAULT_SONNET_MODEL: deepseek/deepseek-v4-flash
          ANTHROPIC_DEFAULT_OPUS_MODEL: deepseek/deepseek-v4-flash
      mcpServers: *academicArmyMcpServers
  glm-5.2:
    kind: claude
    options:
      model: zai/glm-5.2
      effort: xhigh
      settings:
        env:
          ANTHROPIC_BASE_URL: https://ai-gateway.vercel.sh
          ANTHROPIC_API_KEY: ""
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: zai/glm-5.2
          ANTHROPIC_DEFAULT_SONNET_MODEL: zai/glm-5.2
          ANTHROPIC_DEFAULT_OPUS_MODEL: zai/glm-5.2
      mcpServers: *academicArmyMcpServers

threads:
  skill:
    runtime: deepseek-v4-pro
    options:
      cwd: .
      permissionMode: dontAsk
      allowedTools: &cwdReadWriteBashAllowedTools
        - Read
        - Grep
        - Glob
        - LS
        - LSP
        - WebFetch
        - WebSearch
        - Edit(./**)
        - Write(./**)
        - NotebookEdit(./**)
        - Bash
  develop-manager:
    runtime: glm-5.2
    options:
      cwd: &developerWorkspacePath workspace/codebase
      permissionMode: dontAsk
      allowedTools: *cwdReadWriteBashAllowedTools
  develop-coding:
    runtime: deepseek-v4-pro
    options:
      cwd: *developerWorkspacePath
      permissionMode: dontAsk
      allowedTools: *cwdReadWriteBashAllowedTools
  memory:
    runtime: deepseek-v4-flash
    options:
      cwd: &memoryWorkingDir workspace/memory
      permissionMode: dontAsk
      allowedTools:
        - Read
        - Grep
        - Glob
        - LS
        - LSP
        - WebFetch
        - WebSearch
        - Edit(./**)
        - Write(./**)
        - NotebookEdit(./**)
  memory-cleaner:
    runtime: deepseek-v4-pro
    options:
      cwd: *memoryWorkingDir
      permissionMode: dontAsk
      allowedTools: *cwdReadWriteBashAllowedTools

agents:
  skill-runner:
    thread: skill
  skill-evaluator:
    thread: skill
  skill-modifier:
    thread: skill
  coding-manager:
    thread: develop-manager
    constants:
      workspacePath: *developerWorkspacePath
  developer:
    thread: develop-coding
    constants:
      workspacePath: *developerWorkspacePath
  code-reviewer:
    thread: develop-coding
    constants:
      workspacePath: *developerWorkspacePath
  trajectory-optimizer:
    thread: skill
  memory-reader: &memoryAgentConfig
    thread: memory
    constants:
      workingDir: *memoryWorkingDir
  memory-modify-planner: *memoryAgentConfig
  memory-modifier: *memoryAgentConfig
  memory-create-planner: *memoryAgentConfig
  memory-creator: *memoryAgentConfig
  memory-cleaner:
    thread: memory-cleaner
    constants:
      workingDir: *memoryWorkingDir
