runtimes:
  codex:
    kind: codex
    options:
      config:
        mcp_servers:
          academic_army_mcp_tools:
            command: python
            tool_timeout_sec: 3600
            args: &academicArmyMcpToolArgs
              - -m
              - academic_army_mcp_tools
            env: &academicArmyMcpEnv
              OPENAI_API_KEY: YOUR_OPENAI_API_KEY
  deepseek-v4-pro:
    kind: claude
    options:
      model: deepseek/deepseek-v4-pro
      effort: xhigh
      settings:
        env:
          ANTHROPIC_BASE_URL: https://ai-gateway.vercel.sh
          ANTHROPIC_API_KEY: ""
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek/deepseek-v4-pro
          ANTHROPIC_DEFAULT_SONNET_MODEL: deepseek/deepseek-v4-pro
          ANTHROPIC_DEFAULT_OPUS_MODEL: deepseek/deepseek-v4-pro
      mcpServers: &academicArmyMcpServers
        academic_army_mcp_tools:
          command: python
          timeout: 3600000
          args: *academicArmyMcpToolArgs
          env: *academicArmyMcpEnv
  deepseek-v4-flash:
    kind: claude
    options:
      model: deepseek/deepseek-v4-flash
      settings:
        env:
          ANTHROPIC_BASE_URL: https://ai-gateway.vercel.sh
          ANTHROPIC_API_KEY: ""
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek/deepseek-v4-flash
          ANTHROPIC_DEFAULT_SONNET_MODEL: deepseek/deepseek-v4-flash
          ANTHROPIC_DEFAULT_OPUS_MODEL: deepseek/deepseek-v4-flash
      mcpServers: *academicArmyMcpServers
  glm-5.2:
    kind: claude
    options:
      model: zai/glm-5.2
      effort: xhigh
      settings:
        env:
          ANTHROPIC_BASE_URL: https://ai-gateway.vercel.sh
          ANTHROPIC_API_KEY: ""
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: zai/glm-5.2
          ANTHROPIC_DEFAULT_SONNET_MODEL: zai/glm-5.2
          ANTHROPIC_DEFAULT_OPUS_MODEL: zai/glm-5.2
      mcpServers: *academicArmyMcpServers

threads:
  skill:
    runtime: codex
    options:
      model: gpt-5.5
      workingDirectory: .
      sandboxMode: danger-full-access
  develop-manager:
    runtime: glm-5.2
    options:
      cwd: &developerWorkspacePath workspace/codebase
      permissionMode: dontAsk
      tools: &cwdReadWriteBashTools
        - Read
        - Grep
        - Glob
        - WebFetch
        - WebSearch
        - Edit
        - Write
        - NotebookEdit
        - Bash
      allowedTools: *cwdReadWriteBashTools
  develop-coding:
    runtime: deepseek-v4-pro
    options:
      cwd: *developerWorkspacePath
      permissionMode: dontAsk
      tools: *cwdReadWriteBashTools
      allowedTools: *cwdReadWriteBashTools
  memory:
    runtime: deepseek-v4-flash
    options:
      cwd: *developerWorkspacePath
      additionalDirectories: &memoryAdditionalDirectories
        - ../memory
      permissionMode: dontAsk
      tools: &memoryReadWriteTools
        - Read
        - Grep
        - Glob
        - WebFetch
        - WebSearch
        - Edit
        - Write
        - NotebookEdit
      allowedTools: &memoryReadWriteAllowedTools
        - Read
        - Grep
        - Glob
        - WebFetch
        - WebSearch
        - Edit(../memory/**)
  memory-cleaner:
    runtime: deepseek-v4-pro
    options:
      cwd: *developerWorkspacePath
      additionalDirectories: *memoryAdditionalDirectories
      permissionMode: dontAsk
      tools: *memoryReadWriteTools
      allowedTools: *memoryReadWriteAllowedTools

agents:
  skill-runner:
    thread: skill
  skill-evaluator:
    thread: skill
  skill-modifier:
    thread: skill
  coding-manager:
    thread: develop-manager
    constants:
      workspacePath: *developerWorkspacePath
  developer:
    thread: develop-coding
    constants:
      workspacePath: *developerWorkspacePath
      prompts:
        - url: https://raw.githubusercontent.com/DietrichGebert/ponytail/HEAD/skills/ponytail/SKILL.md
        - path: metaskills/academic-army-coding-style/METASKILL.md
  code-reviewer:
    thread: develop-coding
    constants:
      workspacePath: *developerWorkspacePath
      prompts:
        - url: https://raw.githubusercontent.com/DietrichGebert/ponytail/HEAD/skills/ponytail-review/SKILL.md
        - path: metaskills/academic-army-coding-style/METASKILL.md
  memory-reader: &memoryAgentConfig
    thread: memory
    constants:
      workingDir: *developerWorkspacePath
  memory-modify-planner: *memoryAgentConfig
  memory-modifier: *memoryAgentConfig
  memory-create-planner: *memoryAgentConfig
  memory-creator: *memoryAgentConfig
  memory-cleaner:
    thread: memory-cleaner
    constants:
      workingDir: *developerWorkspacePath
