runtimes:
  codex:
    kind: codex
    options:
      config:
        mcp_servers:
          academic_army_mcp_tools:
            command: python
            args:
              - -m
              - mcp-server
            cwd: .
            env:
              PYTHONPATH: .
            tool_timeout_sec: 3600
  qwen:
    kind: qwen
    options:
      authType: openai
      model: deepseek-reasoner
      env:
        OPENAI_BASE_URL: https://api.deepseek.com
        OPENAI_MODEL: deepseek-reasoner
        OPENAI_REASONING_EFFORT: high

threads:
  codex-develop-full-access:
    runtime: codex
    options:
      model: gpt-5.5
      workingDirectory: &developerWorkspacePath output/codebase
      sandboxMode: danger-full-access
  codex-develop-reader:
    runtime: codex
    options:
      model: gpt-5.5
      workingDirectory: *developerWorkspacePath
      sandboxMode: danger-full-access
  qwen-develop-full-access:
    runtime: qwen
    options:
      cwd: *developerWorkspacePath
      permissionMode: yolo
  codex-skill-runner-full-access:
    runtime: codex
    options:
      model: gpt-5.5
      workingDirectory: .
      sandboxMode: danger-full-access
  codex-skill-runner-read-only:
    runtime: codex
    options:
      model: gpt-5.5
      workingDirectory: .
      sandboxMode: danger-full-access

agents:
  coding-manager:
    thread: codex-develop-full-access
    constants:
      workspacePath: *developerWorkspacePath
  developer:
    thread: qwen-develop-full-access
    constants:
      workspacePath: *developerWorkspacePath
  code-reviewer:
    thread: codex-develop-reader
    constants:
      workspacePath: *developerWorkspacePath
  skill-runner:
    thread: codex-skill-runner-full-access
  skill-evaluator:
    thread: codex-skill-runner-read-only
  skill-modifier:
    thread: codex-skill-runner-full-access
  trajectory-optimizer:
    thread: codex-skill-runner-full-access
