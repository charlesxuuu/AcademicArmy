runtimes:
  codex:
    kind: codex
    options:
      config:
        mcp_servers:
          academic_army_mcp_tools:
            command: python
            args:
              - -m
              - mcp-server
            cwd: .
            env:
              PYTHONPATH: .
            tool_timeout_sec: 3600
  qwen:
    kind: qwen
    options:
      authType: openai
      model: deepseek-reasoner
      env:
        OPENAI_BASE_URL: https://api.deepseek.com
        OPENAI_MODEL: deepseek-v4-pro
        OPENAI_REASONING_EFFORT: high
      mcpServers:
        academic_army_mcp_tools:
          command: python
          args:
            - -m
            - mcp-server
          cwd: .
          env:
            PYTHONPATH: .
          timeout: 3600000

threads:
  skill:
    runtime: codex
    options:
      model: gpt-5.5
      sandboxMode: danger-full-access
      workingDirectory: .
  develop:
    runtime: codex
    options:
      model: gpt-5.5
      sandboxMode: danger-full-access
      workingDirectory: &developerWorkspacePath output/codebase
  memory:
    runtime: codex
    options:
      model: gpt-5.5
      sandboxMode: danger-full-access
      workingDirectory: &memoryWorkingDir output/developing-memory

agents:
  skill-runner:
    thread: skill
  skill-evaluator:
    thread: skill
  skill-modifier:
    thread: skill
  coding-manager:
    thread: develop
    constants:
      workspacePath: *developerWorkspacePath
  developer:
    thread: develop
    constants:
      workspacePath: *developerWorkspacePath
  code-reviewer:
    thread: develop
    constants:
      workspacePath: *developerWorkspacePath
  trajectory-optimizer:
    thread: skill
  memory-reader:
    thread: memory
    constants:
      workingDir: *memoryWorkingDir
  memory-modify-planner:
    thread: memory
    constants:
      workingDir: *memoryWorkingDir
  memory-modifier:
    thread: memory
    constants:
      workingDir: *memoryWorkingDir
  memory-create-planner:
    thread: memory
    constants:
      workingDir: *memoryWorkingDir
  memory-creator:
    thread: memory
    constants:
      workingDir: *memoryWorkingDir
