interface:
  display_name: "Academic Army Coding Plan"
  short_description: "Readable coding plan with semantic harnesses, tests, and raw exports"
  default_prompt: "Create an English coding_plan.md and Chinese coding_plan.explain.md with $academic-army-coding-plan from the available paper blueprint, experiment plan, repository context, and mandatory pre-planning deepresearch. Use project-relative paths, semantic module/method/harness/test names, natural cross-references instead of abstract global IDs, separate paper-goal harness structure from functional testing structure, include a Chinese decision-rationale explanation, separate raw, metadata, metric, analysis, and summary outputs, and read both artifacts back before the final response. If the request writes to output/evolve-* or prior feedback says a reviewer cannot read local artifacts, add a Review Handoff section and paste the complete read-back contents of both generated files under clear path headings after the validation summary; paths-only, summary-only, or partial-excerpt final responses are incomplete."

dependencies:
  tools:
    - type: "mcp"
      value: "academic_army_mcp_tools"
      description: "Provides academic_army_mcp_tools.deepresearch for current method, baseline, dataset, benchmark, metric, artifact, and evaluation-harness evidence."
      transport: "stdio"
