interface:
  display_name: "Academic Army Experiment Plan"
  short_description: "Strategic claim-to-evidence experiment plan plus Chinese rationale"
  default_prompt: "Create an English experiment_plan.md and Chinese experiment_plan.explain.md with $academic-army-experiment-plan. Read the available blueprint, prior artifacts, artifact output directories, metaskill context, and revision feedback first; use academic_army_mcp_tools.deepresearch for live venue and recent-paper experiment patterns; make decisive planning choices when the inputs and research are sufficient."

dependencies:
  tools:
    - type: "mcp"
      value: "academic_army_mcp_tools"
      description: "Provides academic_army_mcp_tools.deepresearch for live recent-paper, target-venue, baseline, dataset, metric, benchmark, artifact, motivation-pattern, and reviewer-expectation evidence."
      transport: "stdio"
