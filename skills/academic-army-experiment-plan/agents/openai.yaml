interface:
  display_name: "Academic Army Experiment Plan"
  short_description: "Clean claim-to-evidence plan plus contracts and research context"
  default_prompt: "Create experiment_plan.md, experiment_plan_explanation.<lang>.md, experiment_interface_contracts.yaml, experiment_metric_contracts.yaml, and research_context.md with $academic-army-experiment-plan."

dependencies:
  tools:
    - type: "mcp"
      value: "academic_army_mcp_tools"
      description: "Provides academic_army_mcp_tools.deepresearch for live recent-paper, target-venue, baseline, dataset, metric, benchmark, artifact, motivation-pattern, and reviewer-expectation evidence."
      transport: "stdio"
