experiment_plan_summary:
  output_files:
    experiment_plan_markdown: experiment_plan.md
    explanation_markdown: experiment_plan_explanation.<lang>.md
    plan_language: English
    explanation_language_suffix: string
  confirmation_ledger:
    user_specified_facts: [string]
    blueprint_confirmed_facts: [string]
    existing_draft_note_or_result_facts: [string]
    runtime_research_facts_used_in_this_version: [string]
    planning_commitments_derived_from_those_facts: [string]
    planning_items_closed_in_this_revision:
      - item: string
        closed_by_source_state: user_specified_or_blueprint_confirmed_or_existing_evidence_or_live_research_selected_or_downstream_execution_detail
        controlling_fact: string
    remaining_open_planning_items:
      - item: string
        why_it_changes_plan_structure: string
        affected_objective_or_claim: string
  title: string
  paper_level_experimental_thesis: string
  evidence_strategy_for_paper_story:
    summary: string
    motivation_or_insight_evidence: [string]
    final_evaluation_evidence: [string]
    venue_reviewer_concerns_addressed: [string]
  claim_to_evidence_map:
    - paper_claim: string
      required_evidence: [string]
      objective_heading: string
      story_placement: string
      planning_state: user_specified_or_blueprint_confirmed_or_existing_evidence_or_live_research_selected_or_skill_derived_or_open_input
      comparator_or_baseline_class: [string]
      dataset_benchmark_trace_workload_scene_user_deployment_or_simulation_class: [string]
      metric_or_observable_evidence_family: [string]
      intended_reader_takeaway: string
  experiment_objective_groups:
    - objective_heading: string
      story_placement: string
      evidence_role: [motivation_or_design_insight_or_main_effectiveness_or_ablation_mechanism_or_scalability_efficiency_or_robustness_stress_or_generalization_or_human_perceptual_or_deployment_realism_or_artifact_reproducibility]
      supported_paper_claims: [string]
      planning_state_and_source:
        source_state: user_specified_or_blueprint_confirmed_or_existing_evidence_or_live_research_selected_or_skill_derived_or_open_input
        source_detail: string
        execution_selection_handle: string
      motivation_design_insight_fields:
        intuition_made_visible: string_or_null
        minimal_demonstration_setting: string_or_null
        one_glance_evidence_artifact: string_or_null
        link_to_the_full_method_evaluation: string_or_null
      evaluation_setting:
        datasets_benchmarks_traces_workloads_scenes_users_deployments_or_simulations: [string]
        selection_handles: [string]
      comparators_and_baselines:
        named_baselines: [string]
        comparator_classes: [string]
        source_state: user_specified_or_blueprint_confirmed_or_existing_evidence_or_live_research_selected_or_skill_derived_or_open_input
      metrics_and_observable_evidence:
        primary: [string]
        secondary: [string]
        qualitative_or_perceptual_or_user_evidence: [string]
        statistical_or_uncertainty_reporting: [string]
      controls_variables_and_stress_conditions: [string]
      expected_tables_figures_or_qualitative_artifacts: [string]
      downstream_execution_interface:
        data_handles: [string]
        code_model_benchmark_or_simulator_handles: [string]
        required_measurements_or_logging_schema: [string]
        expected_result_files: [string]
        figure_table_or_writing_consumers: [string]
      priority_and_dependencies:
        priority: critical_or_high_or_medium_or_low
        depends_on: [string]
        prepares_for_or_feeds: [string]
  cross_experiment_coherence:
    motivation_to_final_evaluation_chain: string
    objective_interdependencies: [string]
    shared_protocol_requirements: [string]
    positive_evidence_chain: [string]
  downstream_feedback_slots:
    experiment_execution_feedback: [string]
    result_analysis_feedback: [string]
    plotting_and_figure_planning_feedback: [string]
    paper_writing_feedback: [string]
    review_or_rebuttal_feedback: [string]
