paper_blueprint_summary:
  output_files:
    blueprint_markdown: paper_blueprint.md
    explanation_markdown: paper_blueprint_explanation.<lang>.md
    output_language: string
    explanation_language_suffix: string
  title: string
  target_venue:
    primary: string
    alternatives: [string]
    fit_score: integer_or_null
    fit_rationale: string
  contribution_type: [string]
  exemplar_analysis:
    storytelling_exemplars:
      - title: string
        venue: string
        year: integer_or_null
        source: string
        recency_basis: last_2_3_years_or_latest_3_cycles_or_expanded_last_5_years_or_needs_verification
        why_current_storytelling_exemplar: string
        transferable_storytelling_lesson: string
        non_transferable_warning: string
        verification_status: verified_or_tentative_or_needs_verification
    technical_exemplars:
      - title: string
        venue: string
        year: integer_or_null
        source: string
        influence_signal: string
        core_technical_idea: string
        technical_lesson_for_current_work: string
        verification_status: verified_or_tentative_or_needs_verification
    evaluation_exemplars:
      - title: string
        venue: string
        year: integer_or_null
        source: string
        datasets_or_workloads: [string]
        baselines: [string]
        metrics: [string]
        evaluation_lesson_for_current_work: string
        verification_status: verified_or_tentative_or_needs_verification
  distilled_patterns:
    storytelling_patterns: [string]
    technical_patterns: [string]
    evaluation_patterns: [string]
  design_rationale:
    core_judgment: string
    blueprint_overview:
      paper_positioning: string
      central_thesis: string
      main_contribution: string
      primary_claim: string
      method_direction: string
      evaluation_main_line: string
      most_important_limitation_or_risk: string
      most_important_evidence_requirement: string
      research_development_order: string
    validation_overview:
      - key_blueprint_content: string
        why_it_matters: string
        main_user_validation_question: string
    core_strategy_premises:
      target_venue_premise: string
      problem_premise: string
      contribution_premise: string
      novelty_premise: string
      evidence_premise: string
      storytelling_premise: string
      research_strategy_premise: string
    venue_storytelling_patterns:
      - pattern: string
        influence_on_blueprint: string
    technical_anchor_rationale:
      - anchor: string
        influence_on_method_or_evaluation: string
    claim_rationale:
      - claim_section: string
        blueprint_content_digest: string
        why_scoped_this_way: string
        relation_to_thesis: string
    experiment_rationale:
      - experiment_section: string
        blueprint_content_digest: string
        why_needed: string
        relation_to_claims: string
    figure_rationale:
      - figure_section: string
        blueprint_content_digest: string
        narrative_role: string
    scope_and_limitation_rationale: string
    diagnostic_derivation_chains:
      - starting_premise: string
        derived_blueprint_choices: [string]
        evidence_needed: string
        likely_failure_point: string
        blueprint_revision_if_chain_fails: string
    disagreement_diagnosis:
      - disagreement_type: string
        upstream_premise_to_inspect: string
        affected_blueprint_sections: [string]
        likely_revision_direction: string
  central_thesis:
    thesis: string
    acceptance_critical_statement: string
    contribution_boundary: string
  problem_framing:
    community_pain_point: string
    why_now: string
    existing_approach_gap: string
  core_idea:
    insight: string
    narrative_center_rationale: string
    tradeoff_changed: string
  method_design:
    components:
      - title: string
        function: string
        relation_to_thesis: string
    assumptions: [string]
  claims:
    - section_reference: string
      title: string
      claim: string
      why_it_matters_to_thesis: string
      evidence_required: [string]
      baselines: [string]
      baseline_gap_rationale: string
      metrics: [string]
      connected_experiment_sections: [string]
      connected_figure_sections: [string]
      connected_scope_sections: [string]
      failure_condition: string
      status: supported_or_unsupported_or_needs_experiment_or_needs_verification
  related_work:
    - title: string
      source: string
      role: required_baseline_or_required_citation_or_contextual
      delta: string
      verification_status: verified_or_tentative_or_needs_verification
  experiments:
    - section_reference: string
      title: string
      purpose: string
      datasets_or_workloads: [string]
      baselines: [string]
      metrics: [string]
      evidence_role: string
      connected_claim_sections: [string]
  figures_and_tables:
    - section_reference: string
      title: string
      message: string
      narrative_role: string
      supports_claim_sections: [string]
      data_source: string
  paper_structure:
    - section_name: string
      rhetorical_role: string
      required_content: string
  reproducibility_assets:
    - title: string
      asset_type: string
      contents: string
      claim_sections_supported: [string]
      status: string
  limitations_and_scope:
    - section_reference: string
      title: string
      boundary_or_limitation: string
      reason_for_boundary: string
      affected_claim_sections: [string]
  explanation_style_checks:
    paper_design_rationale_only: boolean
    no_tool_process: boolean
    no_file_format_rationale: boolean
    no_downstream_agent_usage: boolean
    no_project_todos: boolean
    avoids_synthetic_ids: boolean
  risks: [string]
