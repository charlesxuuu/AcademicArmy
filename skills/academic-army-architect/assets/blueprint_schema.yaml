paper_blueprint_summary:
  output_files:
    blueprint_markdown: paper_blueprint.md
    explanation_markdown: paper_blueprint_explanation.<lang>.md
    output_language: string
    explanation_language_suffix: string
  title: string
  paper_identity:
    working_title: string
    research_area: string
    target_venue_candidates: [string]
    paper_type: string
    research_artifact: string
    current_input_state: string
  target_venue:
    primary: string
    alternatives: [string]
    reviewer_audience: string
    contribution_posture: string
    evidence_standard: string
    fit_score: integer_or_null
    fit_rationale: string
  exemplar_analysis:
    storytelling_exemplars:
      - title: string
        venue: string
        year: integer_or_null
        source: string
        recency_basis: last_2_3_years_or_latest_3_cycles_or_expanded_last_5_years_or_needs_verification
        why_current_storytelling_exemplar: string
        transferable_storytelling_lesson: string
        non_transferable_warning: string
        verification_status: verified_or_tentative_or_needs_verification
    technical_exemplars:
      - title: string
        venue: string
        year: integer_or_null
        source: string
        influence_signal: string
        core_technical_idea: string
        technical_lesson_for_current_work: string
        verification_status: verified_or_tentative_or_needs_verification
    evaluation_exemplars:
      - title: string
        venue: string
        year: integer_or_null
        source: string
        evidence_class_lesson: string
        metric_family_lesson: string
        comparison_class_lesson: string
        verification_status: verified_or_tentative_or_needs_verification
  distilled_patterns:
    storytelling_patterns: [string]
    technical_patterns: [string]
    evidence_patterns: [string]
  core_strategy_premises:
    target_venue_premise: string
    problem_premise: string
    contribution_premise: string
    novelty_premise: string
    evidence_premise: string
    storytelling_premise: string
    scope_premise: string
  central_thesis:
    one_sentence_thesis: string
    acceptance_critical_paper_bet: string
    downgrade_or_falsification_condition: string
  contribution_contract:
    primary_contribution: string
    secondary_contributions: [string]
    supporting_contributions: [string]
    non_contributions_and_boundaries: [string]
  claim_hierarchy:
    - title: string
      statement: string
      role: acceptance_critical_or_supporting_or_optional_or_deferred
      evidence_obligation: string
      acceptable_proof_modes: [string]
      required_comparison_class: [string]
      metric_family: [string]
      scope_boundary: string
      current_support_status: supported_or_unsupported_or_needs_evidence_or_needs_verification
      failure_implication: string
  related_work_boundary:
    work_clusters:
      - cluster_name: string
        already_solves: string
        blueprint_delta: string
        comparison_obligation: string
        overclaim_boundary: string
        verification_status: verified_or_tentative_or_needs_verification
    required_differentiation_points: [string]
    highest_related_work_risks: [string]
  method_abstraction:
    core_idea: string
    mechanism_class: string
    inputs: [string]
    outputs: [string]
    decision_variables: [string]
    constraints: [string]
    assumptions_and_invariants: [string]
    delegated_method_details: [string]
  evidence_obligations:
    - title: string
      supported_claim: string
      required_evidence_type: string
      metric_family: [string]
      baseline_or_comparison_class: [string]
      data_or_workload_class: [string]
      minimum_acceptable_support: string
      planning_freedom: string
      failure_implication: string
  narrative_requirements:
    opening_tension: string
    central_abstraction: string
    story_arc: [string]
    terms_to_foreground: [string]
    claims_to_avoid_foregrounding: [string]
    delegated_content_planning: [string]
  visual_argument_requirements:
    - title: string
      message_that_must_be_visible: string
      why_it_matters: string
      related_thesis_or_claim: string
      planning_freedom: string
  scope_boundaries:
    in_scope_setting: [string]
    out_of_scope_setting: [string]
    accepted_assumptions: [string]
    allowed_claims: [string]
    deferred_claims: [string]
    claims_avoided_by_design: [string]
  research_risks_and_dependency_signals:
    highest_risk_premise: string
    highest_risk_claim: string
    highest_risk_related_work_boundary: string
    highest_risk_evidence_gap: string
    risk_materialization_changes: [string]
  open_planning_variables:
    content_planning: [string]
    experiment_planning: [string]
    figure_planning: [string]
    method_planning: [string]
    related_work_planning: [string]
    review_risk_planning: [string]
  downstream_planning_interfaces:
    content_planning:
      use: [string]
      preserve_constraints: [string]
      produce_later: [string]
      allowed_to_decide: [string]
    experiment_planning:
      use: [string]
      preserve_constraints: [string]
      produce_later: [string]
      allowed_to_decide: [string]
    figure_planning:
      use: [string]
      preserve_constraints: [string]
      produce_later: [string]
      allowed_to_decide: [string]
    writing:
      use: [string]
      preserve_constraints: [string]
      produce_later: [string]
      allowed_to_decide: [string]
    review_risk:
      use: [string]
      preserve_constraints: [string]
      produce_later: [string]
      allowed_to_decide: [string]
  design_rationale:
    blueprint_overview:
      paper_positioning: string
      central_thesis: string
      main_contribution: string
      primary_claim: string
      evidence_obligation_summary: string
      most_important_boundary: string
      open_planning_variable_summary: string
    validation_overview:
      - key_blueprint_content: string
        why_it_matters: string
        main_user_validation_question: string
    item_rationales:
      - semantic_item_name: string
        blueprint_content_digest: string
        premise_source: string
        derivation: string
        downstream_connections: [string]
        user_validation_point: string
    delegated_detail_rationale:
      - detail_area: content_planning_or_experiment_planning_or_figure_planning_or_method_planning_or_writing_or_review_risk
        what_is_left_open: [string]
        why_left_open: string
        constraint_from_blueprint: string
    diagnostic_derivation_chains:
      - starting_premise: string
        derived_blueprint_choices: [string]
        evidence_needed: string
        likely_failure_point: string
        blueprint_revision_if_chain_fails: string
    disagreement_diagnosis:
      - disagreement_type: string
        upstream_premise_to_inspect: string
        affected_blueprint_objects: [string]
        likely_revision_direction: string
  explanation_style_checks:
    standalone_validation_companion: boolean
    includes_blueprint_content_digest: boolean
    uses_semantic_anchors: boolean
    explains_delegated_details: boolean
    avoids_synthetic_ids: boolean
