paper_blueprint_summary:
  output_files:
    blueprint_markdown: paper_blueprint.md
    explanation_markdown: paper_blueprint_explanation.<lang>.md
    output_language: english
    explanation_language_suffix: string
  confirmed_user_context:
    research_inputs: [string]
    existing_materials: [string]
    target_field_or_venue_preferences: [string]
    paper_type_preferences: [string]
    existing_method_or_substrate: [string]
    existing_experiment_or_prototype_foundation: [string]
    strategic_preferences_or_boundaries: [string]
    blueprint_purpose: [string]
    downstream_planning_pipeline: [string]
    abstraction_level_preferences: [string]
    explanation_preferences: [string]
    content_delegated_to_later_planning: [string]
  user_mentioned_preferences:
    method_preferences: [string]
    evidence_preferences: [string]
    baseline_or_comparison_preferences: [string]
    implementation_or_deployment_preferences: [string]
    language_or_readability_preferences: [string]
  working_assumptions:
    - assumption: string
      why_needed: string
      replaced_by_confirmed_input_when: string
  title: string
  paper_identity:
    research_idea: string
    target_venue_posture: string
    paper_type: string
    research_object: string
    context_anchors: [string]
  research_signals_used:
    closest_technical_substrate:
      - title: string
        venue_or_source: string
        year: integer_or_null
        link: string
        lesson_for_blueprint: string
        verification_status: verified_or_tentative_or_needs_verification
    venue_posture:
      - title: string
        venue_or_source: string
        year: integer_or_null
        link: string
        lesson_for_blueprint: string
        verification_status: verified_or_tentative_or_needs_verification
    closest_competing_systems:
      - title: string
        venue_or_source: string
        year: integer_or_null
        link: string
        lesson_for_blueprint: string
        verification_status: verified_or_tentative_or_needs_verification
    storytelling_exemplars:
      - title: string
        venue_or_source: string
        year: integer_or_null
        link: string
        recency_basis: last_1_3_years_or_latest_3_cycles_or_expanded_last_5_years_or_needs_verification
        lesson_for_blueprint: string
        verification_status: verified_or_tentative_or_needs_verification
    method_precedents:
      - title: string
        venue_or_source: string
        year: integer_or_null
        link: string
        lesson_for_blueprint: string
        verification_status: verified_or_tentative_or_needs_verification
    evaluation_precedents:
      - title: string
        venue_or_source: string
        year: integer_or_null
        link: string
        lesson_for_blueprint: string
        verification_status: verified_or_tentative_or_needs_verification
  strategic_thesis:
    main_thesis: string
    central_bet: string
    acceptance_target: string
  canonical_resource_model_and_terminology:
    canonical_resource_terms:
      - term: string
        definition: string
    control_object: string
    delivery_unit: string
    reference_state: string
    reference_usefulness: string
    deadline_feasibility_model: string
    metric_families: [string]
  core_strategic_goals:
    - goal_name: string
      objective: string
      strategic_function: string
      downstream_constraints: [string]
      success_signal: string
  claim_and_scope_architecture:
    main_claim: string
    supporting_claims: [string]
    novelty_scope: string
    positive_scope_boundary: string
    evidence_dependent_claim_calibration: string
  evidence_objectives:
    metric_families: [string]
    phenomena_to_establish: [string]
    system_level_outcomes: [string]
    baseline_families: [string]
    evidence_dimensions_to_cover: [string]
    tactical_choices_delegated_to_experiment_planning: [string]
  downstream_skill_contract:
    content_planning_contract:
      purpose: string
      preserve: [string]
      open_tactical_choices: [string]
    method_planning_contract:
      purpose: string
      preserve: [string]
      open_tactical_choices: [string]
    experiment_planning_contract:
      purpose: string
      preserve: [string]
      open_tactical_choices: [string]
    figure_planning_contract:
      purpose: string
      preserve: [string]
      open_tactical_choices: [string]
    optional_contracts:
      review_planning_contract:
        purpose: string
        preserve: [string]
        open_tactical_choices: [string]
      writing_planning_contract:
        purpose: string
        preserve: [string]
        open_tactical_choices: [string]
  open_strategic_variables:
    - variable: string
      status: unresolved
      affects: [string]
      current_conservative_stance: string
      allowed_resolutions: [string]
      default_propagation_rule: string
  explanation_design:
    what_to_check_first:
      - strategic_judgment: string
        why_user_should_check_it: string
    source_budget:
      load_bearing_signal_count: integer
      additional_background_summary: [string]
    core_starting_points:
      - starting_point: string
        derived_from_confirmed_inputs_or_research_signal: string
        what_user_should_confirm: string
    blueprint_item_rationales:
      - blueprint_item: string
        item_type: top_level_section_or_core_goal_or_open_variable_or_downstream_contract
        restated_content_digest: string
        derived_from_starting_point: string
        relationship_to_other_blueprint_items: string
        downstream_constraints_explained: [string]
        user_check_point: string
    confirmed_context_coverage:
      - confirmed_context_item: string
        strategic_variable_covered_or_narrowed: string
        effect_on_remaining_questions: string
    remaining_strategic_choices:
      - strategic_choice: string
        confirmed_part: string
        unresolved_part: string
        current_default_stance: string
        what_changes_under_different_choices: string
    change_impact_if_confirmed_inputs_change:
      - confirmed_input: string
        affected_blueprint_items: [string]
        likely_revision_direction: string
    evidence_dependent_claim_calibration:
      - evidence_outcome: string
        calibrated_claim_level: string
        affected_blueprint_items: [string]
  validation_checks:
    file_separation_check: boolean
    confirmed_input_hygiene_check: boolean
    redundancy_check: boolean
    tactical_leakage_check: boolean
    defensive_tone_check: boolean
    question_deduplication_check: boolean
    source_role_check: boolean
    source_budget_check: boolean
    source_role_freshness_check: boolean
    skill_meta_language_check: boolean
    item_level_explanation_check: boolean
    evidence_vs_input_separation_check: boolean
    terminology_alignment_check: boolean
    contradiction_check: boolean
    terminology_check: boolean
    overcommitment_check: boolean
    resource_model_completeness_check: boolean
    baseline_fairness_check: boolean
    explanation_alignment_check: boolean
    uses_positive_scope_language: boolean
    uses_semantic_anchors: boolean
    outputs_only_remaining_strategic_questions: boolean
    avoids_tactical_questionnaire: boolean
    avoids_synthetic_ids: boolean
