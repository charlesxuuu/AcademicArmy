paper_blueprint_summary:
  output_files:
    blueprint_markdown: paper_blueprint.md
    explanation_markdown: paper_blueprint_explanation.<lang>.md
    output_language: string
    explanation_language_suffix: string
  title: string
  target_venue:
    primary: string
    alternatives: [string]
    fit_score: integer_or_null
    fit_rationale: string
  contribution_type: [string]
  exemplar_analysis:
    storytelling_exemplars:
      - title: string
        venue: string
        year: integer_or_null
        source: string
        recency_basis: last_2_3_years_or_latest_3_cycles_or_expanded_last_5_years_or_needs_verification
        why_current_storytelling_exemplar: string
        transferable_storytelling_lesson: string
        non_transferable_warning: string
        verification_status: verified_or_tentative_or_needs_verification
    technical_exemplars:
      - title: string
        venue: string
        year: integer_or_null
        source: string
        influence_signal: string
        core_technical_idea: string
        technical_lesson_for_current_work: string
        verification_status: verified_or_tentative_or_needs_verification
    evaluation_exemplars:
      - title: string
        venue: string
        year: integer_or_null
        source: string
        datasets_or_workloads: [string]
        baselines: [string]
        metrics: [string]
        evaluation_lesson_for_current_work: string
        verification_status: verified_or_tentative_or_needs_verification
  distilled_patterns:
    storytelling_patterns: [string]
    technical_patterns: [string]
    evaluation_patterns: [string]
  core_focus_items:
    - id: K1
      focus: string
      purpose: string
      primary_blueprint_sections: [string]
  acceptance_hypothesis: string
  claims:
    - id: string
      claim: string
      evidence_required: [string]
      baselines: [string]
      baseline_gap_rationale: string
      metrics: [string]
      figure_or_table: string
      related_experiments: [string]
      related_risks: [string]
      failure_condition: string
      status: supported_or_unsupported_or_needs_experiment_or_needs_verification
  related_work:
    - title: string
      source: string
      role: required_baseline_or_required_citation_or_contextual
      delta: string
      verification_status: verified_or_tentative_or_needs_verification
  figures_and_tables:
    - id: string
      message: string
      supports_claims: [string]
      data_source: string
  section_traceability:
    - blueprint_section: string
      core_focus_ids: [string]
      related_blueprint_ids: [string]
      why_this_section_exists: string
      downstream_impact: string
  claim_traceability:
    - claim_id: string
      core_focus_ids: [string]
      supporting_experiments: [string]
      supporting_figures_or_tables: [string]
      main_reviewer_risks: [string]
      explanation: string
  explanation_decision_log:
    - decision: string
      blueprint_id: string
      reason: string
      evidence_or_pattern: string
      uncertainty: string
  risks: [string]
  next_actions: [string]
