paper_blueprint_summary:
  output_files:
    blueprint_markdown: paper_blueprint.md
    explanation_markdown: paper_blueprint_explanation.<lang>.md
    output_language: string
    explanation_language_suffix: string
  confirmed_user_context:
    research_inputs: [string]
    existing_materials: [string]
    target_field_or_venue_preferences: [string]
    blueprint_purpose: [string]
    downstream_planning_pipeline: [string]
    output_requirements: [string]
    abstraction_level_preferences: [string]
    explanation_preferences: [string]
    content_delegated_to_later_planning: [string]
    working_assumptions: [string]
  title: string
  paper_identity:
    research_idea: string
    target_venue_posture: string
    paper_type: string
    research_object: string
    current_input_state: string
  exemplar_analysis:
    storytelling_exemplars:
      - title: string
        venue: string
        year: integer_or_null
        source: string
        recency_basis: last_2_3_years_or_latest_3_cycles_or_expanded_last_5_years_or_needs_verification
        strategic_story_lesson: string
        verification_status: verified_or_tentative_or_needs_verification
    technical_exemplars:
      - title: string
        venue: string
        year: integer_or_null
        source: string
        strategic_technical_lesson: string
        verification_status: verified_or_tentative_or_needs_verification
    evidence_exemplars:
      - title: string
        venue: string
        year: integer_or_null
        source: string
        strategic_evidence_lesson: string
        verification_status: verified_or_tentative_or_needs_verification
  top_level_paper_goal:
    acceptance_goal: string
    central_research_bet: string
    strategic_success_condition: string
    strategic_downgrade_condition: string
  goal_decomposition:
    positioning_goal: string
    problem_framing_goal: string
    contribution_goal: string
    novelty_boundary_goal: string
    evidence_goal: string
    communication_goal: string
    scope_control_goal: string
    downstream_planning_goal: string
  goal_cards:
    - goal_name: string
      goal_statement: string
      why_this_goal_matters: string
      strategic_role: acceptance_or_positioning_or_contribution_or_novelty_or_evidence_or_scope_or_communication_or_downstream_planning
      success_condition: string
      derived_constraints: [string]
      delegated_details: [string]
      failure_or_revision_implication: string
  goal_dependency_map:
    supports_acceptance_goal: [string]
    protects_main_contribution: [string]
    protects_novelty_boundary: [string]
    determines_evidence_posture: [string]
    determines_communication_posture: [string]
    downstream_operationalization: [string]
    fragile_goals: [string]
  strategic_claim_posture:
    acceptance_goal_claim:
      generating_goal: string
      claim_posture: string
      required_evidence_posture: string
      scope_boundary: string
      downgrade_condition: string
    contribution_goal_claim:
      generating_goal: string
      claim_posture: string
      required_evidence_posture: string
      scope_boundary: string
      downgrade_condition: string
    evidence_goal_claim:
      generating_goal: string
      claim_posture: string
      required_evidence_posture: string
      scope_boundary: string
      downgrade_condition: string
    deferred_claims:
      - generating_goal: string
        deferred_claim: string
        reason_deferred: string
  strategic_evidence_posture:
    top_level_goal_evidence:
      goal_served: string
      required_evidence_type: string
      comparison_posture: string
      outcome_family: string
      minimum_standard_for_strategic_viability: string
      delegated_experiment_planning: [string]
    contribution_goal_evidence:
      goal_served: string
      required_evidence_type: string
      comparison_posture: string
      outcome_family: string
      minimum_standard_for_strategic_viability: string
      delegated_experiment_planning: [string]
    novelty_boundary_evidence:
      goal_served: string
      required_evidence_type: string
      comparison_posture: string
      outcome_family: string
      minimum_standard_for_strategic_viability: string
      delegated_experiment_planning: [string]
    delegated_experiment_planning: [string]
  strategic_communication_posture:
    first_reader_belief: string
    central_abstraction: string
    story_movement: [string]
    delegated_figure_planning: [string]
    delegated_content_planning: [string]
  strategic_risks:
    goal_most_likely_to_fail: string
    goal_most_likely_to_be_challenged: string
    goal_most_dependent_on_missing_evidence: string
    blueprint_changes_if_risks_materialize: [string]
  delegation_interfaces:
    content_planning_interface:
      goals_to_operationalize: [string]
      constraints_to_preserve: [string]
      tactical_choices_delegated: [string]
    experiment_planning_interface:
      goals_to_operationalize: [string]
      constraints_to_preserve: [string]
      tactical_choices_delegated: [string]
    figure_planning_interface:
      goals_to_operationalize: [string]
      constraints_to_preserve: [string]
      tactical_choices_delegated: [string]
    method_planning_interface:
      goals_to_operationalize: [string]
      constraints_to_preserve: [string]
      tactical_choices_delegated: [string]
    review_planning_interface:
      goals_to_operationalize: [string]
      constraints_to_preserve: [string]
      tactical_choices_delegated: [string]
  design_rationale:
    goal_oriented_overview:
      top_level_paper_goal: string
      central_research_bet: string
      main_contribution_goal: string
      evidence_goal: string
      communication_goal: string
      largest_strategic_risk: string
    validation_overview:
      - key_goal_or_arrangement: string
        why_it_matters: string
        main_user_validation_question: string
    confirmed_context_coverage:
      - confirmed_context_item: string
        covered_or_narrowed_question: string
        effect_on_remaining_questions: string
    remaining_strategic_questions:
      - question: string
        why_not_covered_by_confirmed_context: string
        strategy_change_if_answer_changes: string
    goal_rationales:
      - goal_name: string
        goal_content_digest: string
        design_idea: string
        relationship_to_other_goals: string
        downstream_constraint: string
        user_validation_point: string
    goal_derived_arrangements:
      - arrangement_name: string
        content_digest: string
        generating_goal: string
        derivation: string
        user_validation_point: string
    delegated_detail_rationale:
      - detail_area: content_planning_or_experiment_planning_or_figure_planning_or_method_planning_or_review_planning
        what_is_delegated: [string]
        goal_constraint: string
        reason_for_delegation: string
    fragile_goal_chains:
      - starting_goal: string
        derived_arrangement: [string]
        evidence_or_planning_dependency: string
        likely_failure_point: string
        blueprint_revision_if_chain_fails: string
    strategic_disagreement_diagnosis:
      - disagreement_type: string
        upstream_goal_to_inspect: string
        affected_goal_or_arrangement: [string]
        likely_revision_direction: string
  explanation_style_checks:
    strategic_validation_companion: boolean
    goal_oriented_structure: boolean
    goal_cards_are_core: boolean
    includes_goal_content_digest: boolean
    uses_semantic_anchors: boolean
    explains_delegation_interfaces: boolean
    applies_confirmed_context_filter: boolean
    outputs_only_remaining_strategic_questions: boolean
    avoids_tactical_questionnaire: boolean
    avoids_synthetic_ids: boolean
