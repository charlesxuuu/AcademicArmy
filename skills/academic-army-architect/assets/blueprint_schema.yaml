paper_blueprint_summary:
  output_files:
    blueprint_markdown: paper_blueprint.md
    explanation_markdown: paper_blueprint_explanation.<lang>.md
    output_language: string
    explanation_language_suffix: string
  confirmed_user_context:
    research_inputs: [string]
    existing_materials: [string]
    target_field_or_venue_preferences: [string]
    blueprint_purpose: [string]
    downstream_planning_pipeline: [string]
    output_requirements: [string]
    abstraction_level_preferences: [string]
    explanation_preferences: [string]
    content_delegated_to_later_planning: [string]
    working_assumptions: [string]
  title: string
  paper_identity:
    research_object: string
    target_venue_posture: string
    paper_type: string
    current_input_state: string
    user_confirmed_constraints: [string]
    intended_downstream_planning_pipeline: [string]
    strategic_abstraction_level: string
  exemplar_analysis:
    storytelling_exemplars:
      - title: string
        venue: string
        year: integer_or_null
        source: string
        recency_basis: last_2_3_years_or_latest_3_cycles_or_expanded_last_5_years_or_needs_verification
        strategic_story_lesson: string
        verification_status: verified_or_tentative_or_needs_verification
    technical_exemplars:
      - title: string
        venue: string
        year: integer_or_null
        source: string
        strategic_technical_lesson: string
        verification_status: verified_or_tentative_or_needs_verification
    evidence_exemplars:
      - title: string
        venue: string
        year: integer_or_null
        source: string
        strategic_evidence_lesson: string
        verification_status: verified_or_tentative_or_needs_verification
  core_strategy_premises:
    venue_premise: string
    problem_premise: string
    contribution_premise: string
    novelty_premise: string
    evidence_premise: string
    scope_premise: string
  central_research_bet:
    one_sentence_thesis: string
    acceptance_critical_bet: string
    downgrade_condition: string
  contribution_contract:
    primary_contribution: string
    secondary_contribution_roles: [string]
    non_contributions_and_boundaries: [string]
  claim_strategy:
    - title: string
      claim_statement: string
      strategic_role: acceptance_critical_or_mechanism_or_scope_or_supporting_or_deferred
      evidence_posture: string
      scope_boundary: string
      downgrade_condition: string
  novelty_and_comparison_strategy:
    closest_work_clusters: [string]
    differentiation_posture: string
    comparison_posture: string
    overclaim_boundary: string
  method_abstraction_strategy:
    core_abstraction: string
    mechanism_class: string
    strategic_decision_space: string
    constraints_and_invariants: [string]
    delegated_tactical_method_details: [string]
  evidence_posture:
    - title: string
      strategic_claim_supported: string
      high_level_evidence_type: string
      comparison_posture: string
      outcome_family: string
      minimum_standard_for_strategic_viability: string
      delegated_tactical_choices: [string]
      downgrade_implication: string
  narrative_and_visual_strategy:
    opening_tension: string
    central_abstraction_to_foreground: string
    story_arc: [string]
    visual_argument_requirements: [string]
    delegated_content_and_figure_choices: [string]
  strategic_risks_and_uncertainties:
    highest_risk_premise: string
    highest_risk_claim: string
    highest_risk_novelty_boundary: string
    highest_risk_evidence_gap: string
    strategy_change_if_risks_materialize: [string]
  delegation_boundaries:
    content_planning:
      strategic_boundary: string
      constraints_to_preserve: [string]
      tactical_choices_delegated: [string]
    experiment_planning:
      strategic_boundary: string
      constraints_to_preserve: [string]
      tactical_choices_delegated: [string]
    figure_planning:
      strategic_boundary: string
      constraints_to_preserve: [string]
      tactical_choices_delegated: [string]
    method_planning:
      strategic_boundary: string
      constraints_to_preserve: [string]
      tactical_choices_delegated: [string]
    review_planning:
      strategic_boundary: string
      constraints_to_preserve: [string]
      tactical_choices_delegated: [string]
  strategic_defaults:
    - posture_area: venue_or_contribution_or_evidence_or_narrative_or_method_or_scope
      recommended_default: string
      why_matches_premises: string
      evidence_that_would_change_it: string
      downstream_skill_to_explore_tactical_alternatives: string
  design_rationale:
    strategic_overview:
      paper_positioning: string
      central_research_bet: string
      primary_contribution: string
      acceptance_critical_claim: string
      evidence_posture_summary: string
      delegation_summary: string
      highest_strategic_risk: string
    validation_overview:
      - key_strategic_content: string
        why_it_matters: string
        main_user_validation_question: string
    item_rationales:
      - semantic_item_name: string
        strategic_content_digest: string
        premise_source: string
        derivation: string
        downstream_constraint: string
        user_validation_point: string
    delegated_detail_rationale:
      - detail_area: content_planning_or_experiment_planning_or_figure_planning_or_method_planning_or_review_planning
        what_is_delegated: [string]
        strategic_constraint: string
        reason_for_delegation: string
    fragile_strategic_chains:
      - starting_premise: string
        derived_strategy: [string]
        evidence_needed: string
        likely_failure_point: string
        strategy_revision_if_chain_fails: string
    strategic_disagreement_diagnosis:
      - disagreement_type: string
        upstream_premise_to_inspect: string
        affected_strategy_objects: [string]
        likely_revision_direction: string
  explanation_style_checks:
    strategic_validation_companion: boolean
    includes_strategic_content_digest: boolean
    uses_semantic_anchors: boolean
    explains_delegation_boundaries: boolean
    avoids_tactical_questionnaire: boolean
    avoids_synthetic_ids: boolean
